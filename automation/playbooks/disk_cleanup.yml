---
- name: Disk Cleanup Remediation
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:
    # ################################################################
    # Clear Temp Directory
    - name: Clear directories
      ansible.windows.win_shell: |
        if (Test-Path "{{ item }}") {
            Remove-Item "{{ item }}\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
        }
      loop:
        - C:\Temp
        - C:\DiskFill
        - C:\inetpub\logs
      ignore_errors: true

    # ################################################################
    # ################################################################
    # Windows Temp
    # ################################################################

    - name: Clear Windows Temp
      ansible.windows.win_shell: |
        Remove-Item "C:\Windows\Temp\*" `
        -Recurse `
        -Force `
        -ErrorAction SilentlyContinue

      ignore_errors: true

    #################################################################
    # User Temp
    #################################################################

    - name: Clear User Temp
      ansible.windows.win_shell: |
        Get-ChildItem C:\Users -Directory | ForEach-Object {
          $temp = "$($_.FullName)\AppData\Local\Temp"

          if(Test-Path $temp){
              Remove-Item "$temp\*" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }
        }

      ignore_errors: true

    #################################################################
    # Recycle Bin
    #################################################################

    - name: Clear recycle bin
      ansible.windows.win_shell: |
        Clear-RecycleBin -Force -ErrorAction SilentlyContinue

      ignore_errors: true

    #################################################################
    # Windows Update Cache
    #################################################################

    - name: Stop Windows Update Service
      ansible.windows.win_service:
        name: wuauserv
        state: stopped

      ignore_errors: true

    - name: Remove update cache
      ansible.windows.win_shell: |
        if(Test-path "C:\Windows\SoftwareDistribution\Download")
        {
        Remove-Item `
        "C:\Windows\SoftwareDistribution\Download\*" `
        -Recurse `
        -Force `
        -ErrorAction SilentlyContinue
        }
      ignore_errors: true

    - name: Start Windows Update Service
      ansible.windows.win_service:
        name: wuauserv
        state: started

      ignore_errors: true

    #################################################################
    # IIS Logs
    #################################################################

    - name: Delete IIS logs older than 30 days
      ansible.windows.win_shell: |
        if(Test-Path "C:\inetpub\logs\LogFiles")
        {
            Get-ChildItem `
            "C:\inetpub\logs\LogFiles" `
            -Recurse `
            - File |
            Where-Object {$_.LastWriteTime -lt (Get-Date).AddDays(-30)} |
            Remove-Item -Force -ErrorAction SilentyContinue
        }

      ignore_errors: true

    #################################################################
    # Cleanup Summary
    #################################################################

    - name: Cleanup completed
      debug:
        msg: "Disk cleanup activities completed."
